<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無料動画資料｜AVANA STUDIO</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#0a0f24;--gold:#e8c56b;--muted:#aab3d6;--brd:rgba(255,255,255,.12);
--green:#1fbf3e;--green2:#2ad14c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
background:radial-gradient(600px 400px at 85% -5%,rgba(139,61,240,.35),transparent 60%),
radial-gradient(560px 420px at 0% 10%,rgba(229,48,143,.28),transparent 60%),#0a0f24;
color:#f2f4ff;line-height:1.9;-webkit-font-smoothing:antialiased;min-height:100vh;
display:flex;flex-direction:column;align-items:center;padding:34px 18px 60px}
.wrap{width:100%;max-width:760px;text-align:center}
.chip{display:inline-block;background:#fff;color:#12102e;font-weight:900;font-size:.8rem;padding:6px 18px;border-radius:999px}
h1{font-size:1.5rem;font-weight:900;margin:14px 0 4px;font-family:"Hiragino Mincho ProN",serif}
h1 .gd{color:var(--gold)}
.sub{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.player{border-radius:16px;overflow:hidden;border:1px solid var(--brd);box-shadow:0 24px 60px -20px rgba(139,61,240,.5);background:#000}
video{width:100%;aspect-ratio:16/9;display:block}
.after{margin-top:26px;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:16px;padding:22px 20px}
.after .tt{font-weight:900;font-size:1.05rem}
.after .tt b{color:#39d0e8}
.after p{color:var(--muted);font-size:.88rem;margin-top:6px}
.cta{display:block;margin:18px auto 0;max-width:420px;background:linear-gradient(180deg,var(--green2),var(--green));color:#fff;text-decoration:none;font-weight:900;font-size:1rem;padding:15px 18px;border-radius:12px;box-shadow:0 10px 30px -8px rgba(31,191,62,.7)}
.cta small{display:block;font-weight:700;font-size:.75rem;opacity:.95}
footer{margin-top:auto;padding-top:36px;color:var(--muted);font-size:.72rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <span class="chip">限定公開</span>
  <h1>あなたの<span class="gd">AI分身</span>が、動画を量産する。</h1>
  <p class="sub">約4分。いま話している「彼女」の正体は、冒頭でわかります。</p>
  <div class="player">
    <video src="media/intro-x7k4q9.mp4" poster="media/intro-poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <div class="after">
    <div class="tt">ご覧いただき、ありがとうございます。</div>
    <div class="tt">続きは、トークで<b>「相談したい」</b>と送ってください。</div>
    <p>あなたの会社ならどこで一番効果が出るか、無料でご提案します（オンライン15分〜・押し売りはしません）。</p>
    <a class="cta" href="https://lin.ee/Yx8M7LxH">💬 トークに戻って「相談したい」と送る<small>無料個別相談・1営業日以内にご返信します</small></a>
  </div>
</div>
<footer>© 2026 株式会社SIayell（AVANA STUDIO）</footer>
</body>
</html>
